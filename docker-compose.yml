services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reconan-db
    environment:
      SA_PASSWORD: "ReConan@2024"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./db:/db
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "ReConan@2024" -Q "SELECT 1" -b -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db
    entrypoint: /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P 'ReConan@2024' -i /db/init.sql -No && echo 'ReConan DB initialized.'"
    restart: on-failure:3

volumes:
  sqlserver_data:
