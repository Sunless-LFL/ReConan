# SmartGraph Configuration Properties

# Strong node repulsion - push all nodes apart
graph.node.repulsionforce = 25000000

# Slightly stronger spring so it can actually reach the natural length
graph.node.springforce = 0.0001

# Large preferred distance between connected nodes
graph.node.springnaturalpathlength = 800

# Node radius
graph.node.radius = 35

# Allow user to drag nodes
graph.node.allow-user-move = true

# Automatic layout
graph.layout.autolayout = true