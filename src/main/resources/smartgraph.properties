# SmartGraph Configuration Properties

# Repulsion force between nodes
graph.node.repulsionforce = 50000

# Spring force for edges
graph.node.springforce = 0.005

# Natural length for edges
graph.node.springnaturalpathlength = 200

# Node radius
graph.node.radius = 25

# Allow user to drag nodes
graph.node.allow-user-move = true

# Automatic layout
graph.layout.autolayout = true
